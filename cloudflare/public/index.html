<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Agent</title>
<style>
:root{color-scheme:dark;--bg:#090c10;--panel:#11161d;--line:#26303c;--muted:#9aa7b5;--text:#f4f7fb;--accent:#66bfff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:980px;margin:auto;padding:28px 18px 50px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
h1{font-size:32px;margin:0}.status{font-size:13px;color:var(--muted)}.shell{border:1px solid var(--line);background:var(--panel);border-radius:16px;overflow:hidden}
#messages{height:58vh;min-height:420px;overflow:auto;padding:22px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:82%;padding:12px 14px;border-radius:14px;white-space:pre-wrap;word-break:break-word}.user{align-self:flex-end;background:#18324b}.assistant{align-self:flex-start;background:#171d25;border:1px solid var(--line)}
.composer{border-top:1px solid var(--line);padding:14px;display:grid;grid-template-columns:1fr auto;gap:10px}
textarea,input,button{font:inherit}textarea,input{background:#0c1117;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{resize:vertical;min-height:58px;max-height:180px}button{border:0;border-radius:10px;padding:0 18px;background:var(--accent);color:#04101a;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}.setup{display:flex;gap:8px;margin-bottom:12px}.setup input{flex:1}.note{color:var(--muted);font-size:13px;margin:8px 2px 0}
@media(max-width:650px){#messages{height:62vh}.msg{max-width:94%}.composer{grid-template-columns:1fr}.composer button{height:44px}}
</style>
</head>
<body>
<main>
<header><div><h1>Control Agent</h1><div class="status" id="status">OpenAI-powered chat on Cloudflare Workers</div></div></header>
<div class="setup"><input id="token" type="password" autocomplete="off" placeholder="App access token"><button id="save">Save</button></div>
<div class="shell">
<div id="messages"><div class="msg assistant">Control Agent is ready. Enter the app access token, then send a message.</div></div>
<div class="composer"><textarea id="input" placeholder="Ask Control Agent…" rows="2"></textarea><button id="send">Send</button></div>
</div>
<p class="note">The OpenAI API key stays on the Cloudflare server. This chat can reason about coding tasks, but terminal/GitHub execution needs a separate connected execution backend.</p>
</main>
<script>
const messages=document.querySelector("#messages"),input=document.querySelector("#input"),send=document.querySelector("#send"),token=document.querySelector("#token"),save=document.querySelector("#save"),statusEl=document.querySelector("#status");
const history=[];
token.value=sessionStorage.getItem("controlAgentToken")||"";
save.onclick=()=>{sessionStorage.setItem("controlAgentToken",token.value.trim());statusEl.textContent="Access token saved for this browser session";};
function add(role,text){const d=document.createElement("div");d.className="msg "+role;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight;}
async function go(){
  const message=input.value.trim(); if(!message)return;
  const access=token.value.trim(); if(!access){add("assistant","Enter the app access token first.");return;}
  add("user",message); input.value=""; send.disabled=true; statusEl.textContent="Thinking…";
  try{
    const r=await fetch("/api/chat",{method:"POST",headers:{"content-type":"application/json","authorization":"Bearer "+access},body:JSON.stringify({message,history})});
    const data=await r.json();
    if(!r.ok)throw new Error(data.error||"Request failed");
    add("assistant",data.reply); history.push({role:"user",content:message},{role:"assistant",content:data.reply}); while(history.length>12)history.shift();
    statusEl.textContent="Ready";
  }catch(e){add("assistant","Error: "+e.message);statusEl.textContent="Error";}
  finally{send.disabled=false;input.focus();}
}
send.onclick=go;input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();go();}});
</script>
</body>
</html>
